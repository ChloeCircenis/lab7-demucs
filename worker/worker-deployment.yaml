
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demucs-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demucs-worker
  template:
    metadata:
      labels:
        app: demucs-worker
    spec:
      containers:
        - name: worker
          image: us-central1-docker.pkg.dev/datacenterscalecomputinglab7/demucs-images/demucs-worker:v1
          env:
            - name: REDIS_HOST
              value: redis
            - name: MINIO_HOST
              value: minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
          resources:
            requests:
              memory: "6Gi"
              cpu: "1000m"
            limits:
              memory: "12Gi"
